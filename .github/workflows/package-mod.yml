name: Package People Playground mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build deployed mod archive
        shell: pwsh
        run: |
          ./scripts/deploy/Package-Mod.ps1 -OutputPath artifacts/PersonConnectome-Mod.zip

      - name: Upload mod archive
        uses: actions/upload-artifact@v4
        with:
          name: PersonConnectome-Mod
          path: artifacts/PersonConnectome-Mod.zip
          if-no-files-found: error
